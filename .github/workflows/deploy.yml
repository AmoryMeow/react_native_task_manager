name: Deploy web

on:
  workflow_dispatch:
    inputs:
      target:
        description: EAS Hosting deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: eas-hosting-${{ inputs.target == 'production' && 'production' || github.run_id }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Restrict production deployment to main
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deployments are only allowed from the main branch."
          exit 1

      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: npm run test:ci

      - name: Export web application
        run: npx expo export --platform web

      - name: Upload web export
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: ${{ inputs.target }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download web export
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: Require Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing required GitHub Actions secret: EXPO_TOKEN"
            exit 1
          fi

      - name: Deploy to EAS Hosting
        id: deploy
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DEPLOY_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$DEPLOY_TARGET" = "production" ]; then
            deployment_json="$(npx --yes eas-cli@26.0.0 deploy --prod --json --non-interactive --export-dir dist)"
          else
            deployment_json="$(npx --yes eas-cli@26.0.0 deploy --json --non-interactive --export-dir dist)"
          fi

          deployment_url="$(
            printf '%s' "$deployment_json" | node -e '
              const fs = require("node:fs");

              let deployment;
              try {
                deployment = JSON.parse(fs.readFileSync(0, "utf8"));
              } catch {
                console.error("::error::EAS CLI returned invalid deployment JSON.");
                process.exit(1);
              }

              const url = process.env.DEPLOY_TARGET === "production"
                ? deployment.production?.url
                : deployment.url;

              if (typeof url !== "string" || url.length === 0) {
                console.error(`::error::EAS CLI did not return the expected ${process.env.DEPLOY_TARGET} deployment URL.`);
                process.exit(1);
              }

              let parsedUrl;
              try {
                parsedUrl = new URL(url);
              } catch {
                console.error("::error::EAS CLI returned an invalid deployment URL.");
                process.exit(1);
              }

              if (
                parsedUrl.protocol !== "https:" ||
                !parsedUrl.hostname ||
                parsedUrl.username ||
                parsedUrl.password ||
                /[\r\n]/.test(url)
              ) {
                console.error("::error::EAS CLI returned an unsafe deployment URL; expected a nonempty HTTPS URL.");
                process.exit(1);
              }

              process.stdout.write(parsedUrl.href);
            '
          )"

          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          {
            printf '## EAS Hosting deployment\n\n'
            printf -- '- **Target:** %s\n' "$DEPLOY_TARGET"
            printf -- '- **URL:** [%s](%s)\n' "$deployment_url" "$deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"
